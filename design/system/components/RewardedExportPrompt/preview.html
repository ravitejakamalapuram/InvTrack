<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Inter,sans-serif;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;background:#f5f5f4}
.pane{padding:24px 16px;border-radius:12px;display:grid;place-items:center}
.dark{background:#0a0a0a;color:#fafafa}.light{background:#e7e5e4;color:#171717}
.d{width:280px;border-radius:28px;padding:24px}
.light .d{background:#fff}.dark .d{background:#262626}
h3{margin:0 0 12px;font-size:20px;font-weight:600}.m{font-size:14px;opacity:.8;line-height:1.4}
.r{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;font-size:14px;font-weight:600}
.r span{padding:10px 16px;border-radius:20px}
.light .t{color:#5b4cdb}.dark .t{color:#8b7cf6}
.light .f{background:#5b4cdb;color:#fff}.dark .f{background:#8b7cf6;color:#171717}
</style></head><body>
<div class="pane light"><div class="d"><h3>Watch a short ad to export?</h3><div class="m">InvTrack is free. One short ad helps pay for it. We never share your investments with advertisers.</div><div class="r"><span class="t">Not now</span><span class="f">Watch ad</span></div></div></div>
<div class="pane dark"><div class="d"><h3>Watch a short ad to export?</h3><div class="m">InvTrack is free. One short ad helps pay for it. We never share your investments with advertisers.</div><div class="r"><span class="t">Not now</span><span class="f">Watch ad</span></div></div></div>
</body></html>
