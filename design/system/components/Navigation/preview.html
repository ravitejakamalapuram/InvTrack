<html lang="en">
<head>
<meta charset="utf-8">

<body>
<div id="root"></div>
<script>
(function () {
  var I = window.InvTrack, F = I.fmt;
  function cap(t) { return '<p class="it-cap">' + t + '</p>'; }

  document.getElementById('root').innerHTML = I.panes(function () {
    return I.Navigation({ title: 'Investments', actions: [{ icon: 'sort', label: 'Sort', selected: true }, { icon: 'search', label: 'Search' }],
      body: '<div class="it-stack" style="gap:12px">' + I.InvestmentCard({ type: 'fixed-deposit', name: 'Senior citizen FD', closed: true, positive: true, net: F.compact(14800), badge: { text: '+7.2% IRR' }, last: 'yesterday', entries: '4 entries', invested: F.compact(200000) }) + '</div>', active: 1 });
  }, { });

  I.wire(document);
})();
</script>
</body>
