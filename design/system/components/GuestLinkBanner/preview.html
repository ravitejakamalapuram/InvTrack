<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Inter,sans-serif;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;background:#f5f5f4}
.pane{padding:16px;border-radius:12px}.dark{background:#171717;color:#fafafa}.light{background:#fff;color:#171717}
.b{display:flex;gap:8px;padding:16px;border-radius:12px;border:1px solid}
.light .b{background:rgba(91,76,219,.08);border-color:rgba(91,76,219,.4);--p:#5b4cdb}
.dark .b{background:rgba(139,124,246,.15);border-color:rgba(139,124,246,.4);--p:#8b7cf6}
.i{color:var(--p);font-size:22px}.t{font-size:14px;font-weight:600}.m{font-size:12px;opacity:.8;margin-top:2px}
.a{color:var(--p);font-weight:600;font-size:14px;margin-top:8px}.x{margin-left:auto;font-size:20px;opacity:.7}
</style></head><body>
<div class="pane light"><div class="b"><span class="i">☁</span><div><div class="t">Your data is only on this phone</div><div class="m">Link Google to back it up and keep it if you change phones.</div><div class="a">Link Google</div></div><span class="x">✕</span></div></div>
<div class="pane dark"><div class="b"><span class="i">☁</span><div><div class="t">Your data is only on this phone</div><div class="m">Link Google to back it up and keep it if you change phones.</div><div class="a">Link Google</div></div><span class="x">✕</span></div></div>
</body></html>
