<!-- @dsCard group="Feedback" height=1032 subtitle="Shimmer skeletons for hero, list, cash flow and stats" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>html, body { margin: 0; }</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var I = window.InvTrack, F = I.fmt;
  function cap(t) { return '<p class="it-cap">' + t + '</p>'; }

  document.getElementById('root').innerHTML = I.panes(function () {
    return '<div class="it-stack" style="gap:16px">' +
      I.Skeleton({ kind: 'hero' }) + I.Skeleton({ kind: 'investment' }) + I.Skeleton({ kind: 'cashflow' }) + I.Skeleton({ kind: 'stats' }) + I.Skeleton({ kind: 'section', height: 150 }) +
      I.Skeleton({ kind: 'fullscreen', message: 'Loading your portfolio' }) +
      cap('Skeletons mirror the real layout so nothing jumps when data arrives. The shimmer sweeps every 1.5 s and stops under prefers-reduced-motion.') +
    '</div>';
  });

  I.wire(document);
})();
</script>
</body>
</html>
