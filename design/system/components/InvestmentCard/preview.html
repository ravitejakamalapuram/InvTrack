<!-- @dsCard group="Screens" height=1382 subtitle="Investment list card: type tile, name, return badge, last activity" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>html, body { margin: 0; }</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var I = window.InvTrack, F = I.fmt;
  function cap(t) { return '<p class="it-cap">' + t + '</p>'; }

  // Illustrative figures only.
  var closed = { type: 'fixed-deposit', name: 'Senior citizen FD', closed: true, positive: true, net: F.compact(14800), badge: { text: '+7.2% IRR' }, last: 'yesterday', entries: '4 entries', invested: F.compact(200000) };
  var awaitingFirst = { type: 'bonds', name: 'Gold bond 2029', positive: false, neutral: true, net: F.compact(150000), status: 'Awaiting first payout',
    maturity: { tone: 'warning', icon: 'schedule', label: '7d TO MATURITY' }, last: '3 days ago', entries: '1 entry', invested: F.compact(150000) };
  var awaitingValue = { type: 'p2p-lending', name: 'P2P loan pool A', positive: false, neutral: true, net: F.compact(252000), status: 'Awaiting current value',
    maturity: { tone: 'accent', icon: 'event', label: '21d TO MATURITY' }, last: '2 weeks ago', entries: '9 entries', invested: F.compact(300000) };
  var matured = { type: 'chit-funds', name: 'Chit group 12', positive: true, net: F.compact(8000), badge: { text: '+9.4% IRR' },
    maturity: { tone: 'success', icon: 'check_circle', label: 'MATURED' }, last: 'today', entries: '11 entries', invested: F.compact(120000) };
  var empty = { type: 'other', name: 'Untitled investment', empty: true, last: 'today', entries: '0 entries' };
  document.getElementById('root').innerHTML = I.panes(function () {
    return '<div class="it-stack" style="gap:16px">' +
      '<div>' + I.InvestmentCard(closed) + cap('Closed: grey tile, CLOSED chip, positive net and IRR badge.') + '</div>' +
      '<div>' + I.InvestmentCard(awaitingFirst) + cap('Open, nothing received: neutral amount and the status chip. No return % at all.') + '</div>' +
      '<div>' + I.InvestmentCard(awaitingValue) + cap('Open, some payouts but less than invested: “Awaiting current value”.') + '</div>' +
      '<div>' + I.InvestmentCard(matured) + cap('Maturity chips: MATURED (success), MATURES TODAY and ≤7 days (warning), 8–30 days (accent).') + '</div>' +
      '<div>' + I.InvestmentCard(Object.assign({ selectionMode: true, selected: true }, awaitingFirst, { maturity: null })) + cap('Selection mode adds a checkbox before the tile.') + '</div>' +
      '<div data-privacy="on">' + I.InvestmentCard(closed) + cap('Privacy mode: amounts masked, badge fades out but keeps its space.') + '</div>' +
      '<div>' + I.InvestmentCard(empty) + cap('No cash flows yet: a chevron replaces the value column, and the strip offers View Details instead of the invested amount.') + '</div>' +
    '</div>';
  });

  I.wire(document);
})();
</script>
</body>
</html>
