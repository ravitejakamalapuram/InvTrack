# git-cliff configuration for changelog generation
# https://git-cliff.org

[changelog]
# Template for the changelog header
header = """
# Changelog\n
"""

# Template for the changelog body
# NOTE: For Play Store changelogs (500 char limit), use compact format
# For full changelogs, use the detailed format below
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
# NOTE: Removed for Play Store to save characters (footer wastes ~50 chars)
footer = ""

# Remove leading/trailing whitespace from the template
trim = true

[git]
# Strip ticket tags such as [A82] or [#981, #918] and the trailing PR number (#1044)
commit_preprocessors = [
    { pattern = '\s*\[[^\]]*\]', replace = "" },
    { pattern = '\s*\(#\d+\)', replace = "" },
]

# Parse conventional commits
conventional_commits = true
filter_unconventional = true
split_commits = false

# Only fix/feat/perf reach users, and only with a user-facing scope.
# Scopes below are CI, store-listing, analytics and build plumbing.
commit_parsers = [
    { message = '^(feat|fix|perf)\((ci|cd|build|deps|listing|release|analytics|test|tests|codegen|security-ci)\)', skip = true },
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { body = ".*security", group = "🔒 Security" },
    # Everything else (docs, refactor, style, test, chore, ci) is internal
    { message = ".*", skip = true },
]

# Filter out certain commits
filter_commits = false

# Tag pattern for releases
tag_pattern = "v[0-9].*"

# Sort commits by newest first
sort_commits = "newest"

