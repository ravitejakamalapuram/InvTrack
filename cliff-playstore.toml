# git-cliff configuration optimized for Play Store changelogs
# Play Store limit: 500 characters
# Usage: git cliff --config cliff-playstore.toml --latest --strip all

[changelog]
# No header for Play Store (saves space)
header = ""

# Compact template for Play Store (user-friendly, no technical details)
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
{% if group == "✨ Features" -%}
🆕 What's New
{% for commit in commits -%}
• {{ commit.message | upper_first | trim }}
{% endfor %}
{% endif -%}
{% if group == "🐛 Bug Fixes" -%}

🐛 Bug Fixes & Improvements
{% for commit in commits -%}
• {{ commit.message | upper_first | trim }}
{% endfor %}
{% endif -%}
{% if group == "⚡ Performance" -%}

⚡ Performance Improvements
{% for commit in commits -%}
• {{ commit.message | upper_first | trim }}
{% endfor %}
{% endif -%}
{% if group == "🔒 Security" -%}

🔒 Security Updates
{% for commit in commits -%}
• {{ commit.message | upper_first | trim }}
{% endfor %}
{% endif -%}
{% endfor -%}
"""

# No footer for Play Store (saves ~50 characters)
footer = ""

# Remove all whitespace
trim = true

[git]
# Strip ticket tags such as [A82] or [#981, #918] and the trailing PR number (#1044)
commit_preprocessors = [
    { pattern = '\s*\[[^\]]*\]', replace = "" },
    { pattern = '\s*\(#\d+\)', replace = "" },
]

# Parse conventional commits
conventional_commits = true
filter_unconventional = true
split_commits = false

# Only fix/feat/perf reach users, and only with a user-facing scope.
# Scopes below are CI, store-listing, analytics and build plumbing.
commit_parsers = [
    { message = '^(feat|fix|perf)\((ci|cd|build|deps|listing|release|analytics|test|tests|codegen|security-ci)\)', skip = true },
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { body = ".*security", group = "🔒 Security" },
    # Everything else (docs, refactor, style, test, chore, ci) is internal
    { message = ".*", skip = true },
]

# Filter out certain commits
filter_commits = false

# Tag pattern for releases
tag_pattern = "v[0-9].*"

# Sort commits by newest first
sort_commits = "newest"

