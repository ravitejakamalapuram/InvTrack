# yaml-language-server: $schema=https://raw.githubusercontent.com/ravitejakamalapuram/release-platform/main/schema/release.schema.json
#
# Consumed by release-platform: app-ci.yml on every PR (ci.yml), auto-release.yml (hourly release window), and
# release.yml / promote.yml on demand (Actions -> release -> Run workflow; keyless, GitHub-hosted runners).
# Flow: release uploads a signed bundle to the INTERNAL track -> promote to production. The old self-hosted
# cd.yml was removed (it stays in git history).
app: invtrack
test: flutter pub get && flutter gen-l10n && flutter analyze --fatal-warnings --no-fatal-infos && flutter test --exclude-tags=golden
targets:
  - type: android
    package: com.invtracker.inv_tracker
    flutter: '3.38.4' # bundles Dart 3.10.3, satisfying pubspec's `sdk: ^3.10.1`
    java: '17'
    # PR checks only (app-ci.yml never has signing secrets): unsigned debug appbundle,
    # replacing the old flutter-ci.yml `dry-run-build` input.
    ci_build: flutter pub get && flutter build appbundle --debug
    # Release build: release-platform computes the version from the latest vX.Y.Z tag and exports it.
    # Signing needs no Gradle changes (the workflow injects android.injected.signing.* from the
    # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets).
    build: flutter pub get && flutter gen-l10n && flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"
    aab: build/app/outputs/bundle/release/app-release.aab
    track: internal
    release_notes: CHANGELOG.md
