name: Deletion job tests

# Firestore rules tests (and, from PR 2, the deletion-job tests) against the Firebase emulator.
# Separate from ci.yml so the 12-minute Flutter suite is untouched.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'scripts/account-deletion/**'
      - 'firestore.rules'
      - '.github/workflows/deletion-job-tests.yml'
      - '.github/workflows/account-deletion.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/account-deletion/**'
      - 'firestore.rules'
      - '.github/workflows/deletion-job-tests.yml'
      - '.github/workflows/account-deletion.yml'
  workflow_dispatch: {}

concurrency:
  group: deletion-job-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deletion-job-tests:
    name: deletion-job-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/account-deletion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rules + job tests (Firestore emulator)
        run: npm run test:emulator
