name: Deploy Firestore rules

# Manual only. Deploys firestore.rules from main to the production Firebase project.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    name: deploy-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/784857267556/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: admin-bot@invtracker-b19d1.iam.gserviceaccount.com
      - name: Deploy rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project invtracker-b19d1 --non-interactive
