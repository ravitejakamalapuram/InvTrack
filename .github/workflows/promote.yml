# Create a "production" environment (Settings > Environments) with required reviewers to gate it.
# Staged rollout: auto-release starts at 5%; run `rollout` 0.2, then `complete` after 48 h (see the guard job).
name: promote
# The guard reads this title back from earlier runs to find when a partial production rollout began.
run-name: promote action=${{ inputs.action }} to=${{ inputs.to_track }} fraction=${{ inputs.user_fraction }}

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [promote, rollout, halt, complete]
        default: promote
      from_track:
        type: string
        default: internal
      to_track:
        type: string
        default: production
      user_fraction:
        description: 'Staged rollout fraction, e.g. 0.2 (empty = 100%, refused for promote to production)'
        type: string
        default: '0.2'
      crash_free_users:
        description: 'Crashlytics crash-free users % for this release, e.g. 99.7 (needed to widen or complete a production rollout)'
        type: string
        default: ''

permissions: {}

jobs:
  # A63: no release reaches 100% of production without 48 h at a partial rollout and at least 99.5%
  # crash-free users (scripts/promotion_guard.dart). Halt is never blocked. `promote` to production
  # must use a fraction below 1. The 48 h clock starts at the later of the latest GitHub Release
  # (auto-release creates it just before it promotes at 5%) and the latest successful run of this
  # workflow that promoted to production at a partial fraction. If either cannot be read, 100% is
  # refused.
  guard:
    name: Release safety guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Check rollout soak time and crash-free users
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          TO_TRACK: ${{ inputs.to_track }}
          USER_FRACTION: ${{ inputs.user_fraction }}
          CRASH_FREE_USERS: ${{ inputs.crash_free_users }}
        run: |
          RELEASED_AT="$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt 2>/dev/null || true)"
          echo "Latest GitHub Release published at: ${RELEASED_AT:-unknown}"
          PROMOTE_RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow promote.yml --status success \
            --limit 200 --json displayTitle,createdAt 2>/dev/null || true)"
          # Run outside the Flutter package so plain Dart does not try to resolve Flutter dependencies.
          cp scripts/promotion_guard.dart "$RUNNER_TEMP/promotion_guard.dart"
          RELEASED_AT="$RELEASED_AT" PROMOTE_RUNS="$PROMOTE_RUNS" dart run "$RUNNER_TEMP/promotion_guard.dart"

  promote:
    needs: guard
    permissions:
      contents: read
      id-token: write
    uses: ravitejakamalapuram/release-platform/.github/workflows/promote.yml@v2
    with:
      action: ${{ inputs.action }}
      from_track: ${{ inputs.from_track }}
      to_track: ${{ inputs.to_track }}
      user_fraction: ${{ inputs.user_fraction }}
