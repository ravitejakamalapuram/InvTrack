# Create a "production" environment (Settings > Environments) with required reviewers to gate it.
# Also limit that environment's deployment branches to main: this file and the guard come from the dispatched ref.
# Staged rollout: auto-release starts at 5%; after 48 h run `rollout` 0.2 or `complete` (see the guard job).
name: promote
# The guard reads this title back from earlier runs to find when a partial production rollout began.
run-name: promote action=${{ inputs.action }} to=${{ inputs.to_track }} fraction=${{ inputs.user_fraction }}

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [promote, rollout, halt, complete]
        default: promote
      from_track:
        type: string
        default: internal
      to_track:
        type: string
        default: production
      user_fraction:
        description: 'Rollout fraction, e.g. 0.05 (empty = 100%). Promote to production allows at most 0.05'
        type: string
        default: '0.05'
      crash_free_users:
        description: 'Crashlytics crash-free users % for this release, e.g. 99.7 (needed to widen or complete a production rollout)'
        type: string
        default: ''

permissions: {}

jobs:
  # A63: `promote` to production starts at 5% or less, and no release goes above 5% without 48 h at a
  # partial rollout and at least 99.5% crash-free users (scripts/promotion_guard.dart). Halt is never
  # blocked. A84: the 48 h clock starts at the rollout record release-platform's promote job writes
  # (a `play-production` deployment) after it read the staged release back from Play. With no record,
  # going above 5% is refused. The guard passes the version codes it counted the soak for to the
  # promote job, which first checks that Play still holds exactly those in progress. Only a first
  # attempt dispatched from main may run: a re-run would reuse old inputs and an old guard result.
  guard:
    name: Release safety guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      soak_version_codes: ${{ steps.guard.outputs.soak_version_codes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Check rollout soak time and crash-free users
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          TO_TRACK: ${{ inputs.to_track }}
          USER_FRACTION: ${{ inputs.user_fraction }}
          CRASH_FREE_USERS: ${{ inputs.crash_free_users }}
        run: |
          ROLLOUT_RECORDS="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=play-production&per_page=100" 2>/dev/null || true)"
          # Run outside the Flutter package so plain Dart does not try to resolve Flutter dependencies.
          cp scripts/promotion_guard.dart "$RUNNER_TEMP/promotion_guard.dart"
          ROLLOUT_RECORDS="$ROLLOUT_RECORDS" dart run "$RUNNER_TEMP/promotion_guard.dart"

  promote:
    needs: guard
    # Re-running only this job would reuse the guard's old pass, so it runs only on a first attempt from
    # main. A halt may be re-run or dispatched from anywhere.
    if: inputs.action == 'halt' || (github.ref == 'refs/heads/main' && github.run_attempt == '1')
    permissions:
      contents: read
      id-token: write
      deployments: write   # release-platform records the staged rollout start (A84)
    uses: ravitejakamalapuram/release-platform/.github/workflows/promote.yml@v2
    with:
      action: ${{ inputs.action }}
      from_track: ${{ inputs.from_track }}
      to_track: ${{ inputs.to_track }}
      user_fraction: ${{ inputs.user_fraction }}
      expect_in_progress_version_codes: ${{ needs.guard.outputs.soak_version_codes }}
