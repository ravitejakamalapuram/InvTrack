name: nightly

# Tests that PR CI skips (A63). release.yaml runs `flutter test --exclude-tags=golden`, so the golden
# tests in test/golden and the emulator integration tests in integration_test only run here: every
# night and on demand. Auto-release needs the latest completed nightly run on main to have succeeded
# within the last 36 h (A85, gate job in auto-release.yml), so a failure stops automatic releases until
# a nightly run passes. To unblock a hotfix, dispatch this workflow on main and wait for it to pass.
# A failure posts to Slack (notify-failure job: failing job names and the run link only).
#
# Regenerating goldens: the committed PNGs must be rendered on ubuntu-latest with the pinned Flutter
# below, because font rasterisation differs per OS (PNGs made on macOS fail here with large diffs).
# Never regenerate them locally. Instead run:
#   gh workflow run nightly.yml --ref <your-branch> -f update_goldens=true
#   gh run download <run-id> -n updated-goldens -D /tmp/updated-goldens
# then copy the downloaded contents into test/golden/ (the artifact paths start below test/golden) and commit them.
# The update run only uploads an artifact: it pushes nothing and skips the integration job.
on:
  schedule:
    - cron: '37 1 * * *' # 01:37 UTC = 07:07 IST
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate golden PNGs on ubuntu-latest and upload them as an artifact'
        type: boolean
        default: false

# The release gate rejects a golden regeneration run (it skips the integration job); keep this name in
# step with regenerationRunName in scripts/nightly_gate.dart.
run-name: ${{ inputs.update_goldens && 'nightly golden regeneration' || 'nightly' }}

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goldens:
    name: Golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.4' # keep in step with release.yaml
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get && flutter gen-l10n
      - name: Golden tests
        if: ${{ !inputs.update_goldens }}
        run: flutter test --tags golden test/golden
      - name: Regenerate goldens
        if: ${{ inputs.update_goldens }}
        run: flutter test --tags golden --update-goldens test/golden
      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated-goldens
          path: test/golden/**/goldens/*.png
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration tests (Android emulator)
    if: ${{ !inputs.update_goldens }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.4' # keep in step with release.yaml
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get && flutter gen-l10n
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Critical flows: app start and tabs, add an investment, add cash flows, and the export/import
      # screen. Each line runs on its own; the first failure fails the job.
      - name: Integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            flutter test integration_test/app_test.dart -d emulator-5554
            flutter test integration_test/flows/investment_form_flow_test.dart -d emulator-5554
            flutter test integration_test/flows/cash_flow_crud_test.dart -d emulator-5554
            flutter test integration_test/flows/data_management_flow_test.dart -d emulator-5554

  # Own job so the webhook secret never reaches the test jobs. Sends only job names and the run URL.
  notify-failure:
    name: Notify Slack of Failure
    needs: [goldens, integration]
    if: ${{ !cancelled() && (needs.goldens.result == 'failure' || needs.integration.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOLDENS_RESULT: ${{ needs.goldens.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=""
          [ "$GOLDENS_RESULT" = "failure" ] && failed="goldens"
          [ "$INTEGRATION_RESULT" = "failure" ] && failed="${failed:+$failed, }integration"
          PAYLOAD=$(jq -n --arg text "❌ *Nightly failed for InvTrack*: $failed — $RUN_URL" '{ text: $text }')
          curl -fsS -o /dev/null -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
        shell: bash
