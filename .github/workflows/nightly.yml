name: nightly

# Tests that PR CI skips (A63). release.yaml runs `flutter test --exclude-tags=golden`, so the golden
# tests in test/golden and the emulator integration tests in integration_test only run here: every
# night and on demand. Auto-release needs the latest completed nightly run on main to have succeeded
# within the last 36 h (A85, gate job in auto-release.yml), so a failure stops automatic releases until
# a nightly run passes. To unblock a hotfix, dispatch this workflow on main and wait for it to pass.
# A failure posts to Slack (notify-failure job: failing job names and the run link only).
on:
  schedule:
    - cron: '37 1 * * *' # 01:37 UTC = 07:07 IST
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goldens:
    name: Golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.4' # keep in step with release.yaml
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get && flutter gen-l10n
      - name: Golden tests
        run: flutter test --tags golden test/golden

  integration:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.4' # keep in step with release.yaml
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get && flutter gen-l10n
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Critical flows: app start and tabs, add an investment, add cash flows, and the export/import
      # screen. Each line runs on its own; the first failure fails the job.
      - name: Integration tests
        env:
          # The Gradle daemon (8 GB heap, android/gradle.properties) outlives the build and starves the
          # emulator, which then drops off adb while the tests run. Build without a daemon.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            sh -c 'while true; do echo "$(date +%T) $(free -m | sed -n 2p)"; sleep 10; done > /tmp/mem.log 2>&1 &'
            flutter test integration_test/app_test.dart -d emulator-5554
            flutter test integration_test/flows/investment_form_flow_test.dart -d emulator-5554
            flutter test integration_test/flows/cash_flow_crud_test.dart -d emulator-5554
            flutter test integration_test/flows/data_management_flow_test.dart -d emulator-5554
      - name: Memory diagnostics
        if: ${{ always() }}
        run: |
          cat /tmp/mem.log || true
          free -m
          sudo dmesg | grep -iE 'out of memory|killed process' | tail -5 || true

  # Own job so the webhook secret never reaches the test jobs. Sends only job names and the run URL.
  notify-failure:
    name: Notify Slack of Failure
    needs: [goldens, integration]
    if: ${{ !cancelled() && (needs.goldens.result == 'failure' || needs.integration.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOLDENS_RESULT: ${{ needs.goldens.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=""
          [ "$GOLDENS_RESULT" = "failure" ] && failed="goldens"
          [ "$INTEGRATION_RESULT" = "failure" ] && failed="${failed:+$failed, }integration"
          PAYLOAD=$(jq -n --arg text "❌ *Nightly failed for InvTrack*: $failed — $RUN_URL" '{ text: $text }')
          curl -fsS -o /dev/null -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
        shell: bash
