name: nightly

# Tests that PR CI skips (A63). release.yaml runs `flutter test --exclude-tags=golden`, so the golden
# tests in test/golden and the emulator integration tests in integration_test only run here: every
# night and on demand. Auto-release needs the latest completed nightly run on main to have succeeded
# within the last 36 h (A85, gate job in auto-release.yml), so a failure stops automatic releases until
# a nightly run passes. To unblock a hotfix, dispatch this workflow on main and wait for it to pass.
# A failure posts to Slack (notify-failure job: failing job names and the run link only).
#
# Regenerating goldens: the committed PNGs must be rendered on ubuntu-latest with the pinned Flutter
# below, because font rasterisation differs per OS (PNGs made on macOS fail here with large diffs).
# Never regenerate them locally. Instead run:
#   gh workflow run nightly.yml --ref <your-branch> -f update_goldens=true
#   gh run download <run-id> -n updated-goldens -D /tmp/updated-goldens
# then copy the downloaded contents into test/golden/ (the artifact paths start below test/golden) and commit them.
# The update run only uploads an artifact: it pushes nothing and skips the integration job.
on:
  schedule:
    - cron: '37 1 * * *' # 01:37 UTC = 07:07 IST
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate golden PNGs on ubuntu-latest and upload them as an artifact'
        type: boolean
        default: false

# The release gate rejects a golden regeneration run (it skips the integration job); keep this name in
# step with regenerationRunName in scripts/nightly_gate.dart.
run-name: ${{ inputs.update_goldens && 'nightly golden regeneration' || 'nightly' }}

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  nightly:
    permissions:
      contents: read
    # TODO(pin): switch to @v2 once release-platform tags the reusable nightly (v2.10.0).
    uses: ravitejakamalapuram/release-platform/.github/workflows/nightly.yml@feat/nightly-workflow
    with:
      app_name: InvTrack
      flutter_version: '3.38.4' # keep in step with release.yaml
      setup_command: flutter pub get && flutter gen-l10n
      golden_command: flutter test --tags golden test/golden
      golden_update_command: flutter test --tags golden --update-goldens test/golden
      golden_artifact_path: test/golden/**/goldens/*.png
      update_goldens: ${{ inputs.update_goldens == true }}
      # Critical flows: app start and tabs, add an investment, add cash flows, and the export/import
      # screen. Each line runs on its own; the first failure fails the job.
      integration_script: |
        flutter test integration_test/app_test.dart -d emulator-5554
        flutter test integration_test/flows/investment_form_flow_test.dart -d emulator-5554
        flutter test integration_test/flows/cash_flow_crud_test.dart -d emulator-5554
        flutter test integration_test/flows/data_management_flow_test.dart -d emulator-5554
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
