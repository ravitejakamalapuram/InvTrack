name: account-deletion

# Runs scripts/account-deletion (see its README): deletes the data of accounts that asked to be deleted,
# then re-checks the result in a fresh job and opens an issue if anything is wrong.
#
# - Daily schedule: live, but only once the repo variable ACCOUNT_DELETION_SCHEDULE_ENABLED is 'true'.
# - Manual run: a dry run unless dry_run is unticked.
# - Main only: the Workload Identity provider accepts this repository on refs/heads/main and nothing else.
# - No re-runs of a manual dispatch: a re-run replays its old inputs on its old commit, with production credentials.
#   Dispatch a new run instead. A re-run of a scheduled run is fine: a schedule is never forced.
on:
  schedule:
    - cron: '41 20 * * *' # 20:41 UTC = 02:11 IST, off the hour on purpose
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan only. Nothing is deleted or written. Untick to delete for real.'
        type: boolean
        default: true
      sweep_inactive_guests_days:
        description: 'Also delete guest accounts with no activity for this many days (0 = off)'
        type: string
        default: '0'
      request_email:
        description: 'Operator fallback. Queues the account with this email for deletion; deletes nothing in this run.'
        type: string
        default: ''
      max_per_run:
        description: 'Refuse to delete anything when more accounts than this are due'
        type: string
        default: '25'
      force:
        description: 'Delete even when more than max_per_run accounts are due'
        type: boolean
        default: false

permissions: {}

# One run at a time. A running deletion is never cancelled; a newer run waits.
concurrency:
  group: account-deletion
  cancel-in-progress: false

jobs:
  run:
    name: run
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'ravitejakamalapuram/InvTrack' &&
      (github.event_name != 'schedule' || vars.ACCOUNT_DELETION_SCHEDULE_ENABLED == 'true') &&
      (github.event_name == 'schedule' || github.run_attempt == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for the keyless Google Cloud login
    outputs:
      live: ${{ steps.mode.outputs.live }}
      run_id: ${{ steps.deletion.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/account-deletion
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check inputs and decide the mode
        id: mode
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '25' }}
          SWEEP_DAYS: ${{ inputs.sweep_inactive_guests_days || '0' }}
        run: |
          # The email is read from the event file, never from env: a step prints its env in the log before its first
          # command runs, so a mask registered by the same step would come too late. A rejected value is never echoed.
          REQUEST_EMAIL=$(jq -r '.inputs.request_email // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$REQUEST_EMAIL" ]; then
            if ! [[ "$REQUEST_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+$ ]]; then
              echo "::error::The email input must be one address"
              exit 1
            fi
            echo "::add-mask::$REQUEST_EMAIL"
          fi
          [[ "$SWEEP_DAYS" =~ ^[0-9]{1,4}$ ]] || { echo "::error::sweep_inactive_guests_days must be a whole number (0 = off)"; exit 1; }
          [[ "$MAX_PER_RUN" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::max_per_run must be a whole number from 1 to 9999"; exit 1; }
          # Anything other than an explicit 'false' is a dry run.
          if [ "$DRY_RUN" = "false" ]; then dry_run=false; else dry_run=true; fi
          if [ "$dry_run" = "false" ] && [ -z "$REQUEST_EMAIL" ]; then live=true; else live=false; fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
      # Install before the cloud login so no credential exists while packages are fetched.
      - name: Install dependencies (production only, no install scripts)
        run: npm --prefix scripts/account-deletion install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/784857267556/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: account-deletion-bot@invtracker-b19d1.iam.gserviceaccount.com
      - name: Delete accounts
        id: deletion
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          FORCE: ${{ github.event_name == 'schedule' && 'false' || inputs.force }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '25' }}
          SWEEP_INACTIVE_GUESTS: ${{ inputs.sweep_inactive_guests_days || '0' }}
          # Masked by the mode step above, so this step's header prints ***.
          REQUEST_EMAIL: ${{ inputs.request_email }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }} # only read once the Analytics deletion step is on main
        run: node scripts/account-deletion/run.mjs

  verify:
    name: verify
    needs: run
    # always() so this also checks a run that failed part-way: run.mjs announces run_id before it deletes anything,
    # and this job finds the run's accounts through its hashed audit records. The result test keeps it off for a
    # skipped or cancelled run; live and run_id keep it off for a dry run or an email request.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.run.result == 'success' || needs.run.result == 'failure') &&
      needs.run.outputs.live == 'true' &&
      needs.run.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for the keyless Google Cloud login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/account-deletion
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies (production only, no install scripts)
        run: npm --prefix scripts/account-deletion install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/784857267556/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: account-deletion-bot@invtracker-b19d1.iam.gserviceaccount.com
      - name: Verify the run
        env:
          RUN_ID: ${{ needs.run.outputs.run_id }}
        run: node scripts/account-deletion/verify-run.mjs

  notify:
    name: notify
    needs: [run, verify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open the account-deletion issue, or comment on the open one
    steps:
      - name: Open or update the account-deletion issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_RESULT: ${{ needs.run.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const label = 'account-deletion';
            const { owner, repo } = context.repo;
            const e = process.env;
            const status = [
              `Run: ${e.RUN_URL}`,
              `Trigger: ${e.EVENT_NAME}. Job results: run ${e.RUN_RESULT}, verify ${e.VERIFY_RESULT}.`,
            ].join('\n');
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'B60205', description: 'The account-deletion job needs attention' });
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 30 });
            const existing = open.data.find((i) => !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `The job failed again.\n\n${status}` });
              return;
            }
            const body = [
              'The account-deletion job failed or could not confirm its result.',
              '',
              status,
              '',
              'Open the run and read the step summary (it lists uid hashes only). Exit code 2 in the run job means the cap refused the run because more accounts were due than max_per_run. A request still pending after 3 days, or a verify mismatch, puts the 7-day deletion promise at risk.',
              '',
              'This issue deliberately holds no user id, email or name.',
            ].join('\n');
            await github.rest.issues.create({ owner, repo, title: 'Account-deletion job needs attention', labels: [label], body });
